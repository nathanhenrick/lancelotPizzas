services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: montapizza
      MYSQL_USER: montapizza
      MYSQL_PASSWORD: montapizza
      MYSQL_ROOT_PASSWORD: montapizza-root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-umontapizza", "-pmontapizza"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ${BACKEND_PATH:-../backendLancelotPizzas}
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://localhost:${API_PORT:-8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: montapizza
      DB_USERNAME: montapizza
      DB_PASSWORD: montapizza
      CORS_ALLOWED_ORIGINS: http://localhost:${SITE_PORT:-3000},http://127.0.0.1:${SITE_PORT:-3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@montapizza.local}
      ADMIN_SENHA: ${ADMIN_SENHA:-montapizza123}
    volumes:
      - api-storage:/var/www/html/storage/app
    ports:
      - "${API_PORT:-8000}:8000"

  site:
    build: .
    depends_on:
      - api
    environment:
      NUXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}/api/v1
      NUXT_API_BASE_URL_SERVIDOR: http://api:8000/api/v1
    ports:
      - "${SITE_PORT:-3000}:3000"

volumes:
  db:
  api-storage:
